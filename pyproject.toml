[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wanderer"
version = "0.1.0"
description = "Find moving objects in SPHEREx data and measure what they are made of."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "astropy-healpix>=1.0",
    "reproject>=0.13",
    "requests>=2.31",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    "duckdb>=1.0",
    "pyvo>=1.5",
    "photutils>=1.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wanderer = "wanderer.cli:main"

[tool.setuptools.packages.find]
include = ["wanderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access to the SPHEREx bucket or JPL"]
addopts = "-m 'not network'"
